{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>EVIBE</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
     <nav id="navbar"
          class="fixed top-0 left-0 w-full z-50 
                 flex justify-between items-center 
                 px-16 py-6 
                 text-white 
                 transition-all duration-500">
     
         <div class="text-xl font-light tracking-[0.3em]">
             EVIBE
         </div>
     
         <div class="space-x-10 text-sm tracking-widest">
             <a href="/" class="hover:opacity-70 transition">HOME</a>
             <a href="/products/" class="hover:opacity-70 transition">SHOP</a>
             <a href="/cart/" class="hover:opacity-70 transition">CART</a>
         </div>
     
     </nav>

    {% block content %}
    {% endblock %}

    <!-- FOOTER -->
    <footer class="text-center py-10 bg-black text-white mt-20">
        <p>©️ 2026 EVIBE. Crafted with confidence.</p>
    </footer>

</body>
<script>
    const navbar = document.getElementById("navbar");

    window.addEventListener("scroll", function () {
        if (window.scrollY > 50) {
            navbar.classList.add("bg-white", "text-black", "shadow-md");
            navbar.classList.remove("text-white");
        } else {
            navbar.classList.remove("bg-white", "text-black", "shadow-md");
            navbar.classList.add("text-white");
        }
    });
</script>
</html>
