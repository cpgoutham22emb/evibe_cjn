{% extends "store/base.html" %}

{% block content %}

<section class="px-12 py-16">
    <div class="grid md:grid-cols-2 gap-16">

        <!-- Premium Product Gallery -->
        <div class="flex flex-col md:flex-row gap-8">
        
            <!-- Thumbnails -->
            <div class="flex md:flex-col gap-4 overflow-x-auto md:overflow-visible pb-2 md:pb-0">
                {% for image in product.images.all %}
                    <img src="{{ image.optimized.400|default:image.original_image.url }}"
                         loading="lazy"
						 decoding="async"
                         onclick="changeImage({{ forloop.counter0 }})"
                         class="w-24 h-28 md:w-20 md:h-24 object-cover rounded-md cursor-pointer border border-gray-200 hover:border-black transition duration-300">
                {% endfor %}
            </div>
        
            <!-- Main Image Container -->
            <div class="relative w-full md:max-w-2xl overflow-hidden rounded-lg group">
            
                <picture>
                    <source media="(max-width: 600px)"
                            srcset="{{ product.images.first.optimized.400|default:product.images.first.original_image.url }}">
                
                    <source media="(max-width: 1024px)"
                            srcset="{{ product.images.first.optimized.800|default:product.images.first.original_image.url }}">
                
                    <img id="mainImage"
                         loading="eager"
                         decoding="async"
                         src="{{ product.images.first.optimized.1200|default:product.images.first.original_image.url }}"
                         class="w-full h-auto object-cover transition duration-500 ease-out group-hover:scale-110">
                </picture>
            
            </div>
        </div>
        
        <!-- Fullscreen Modal -->
        <div id="imageModal"
             class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50">
        
            <button onclick="closeModal()"
                    class="absolute top-6 right-8 text-white text-3xl">
                ✕
            </button>
        
            <button onclick="prevImage()"
                    class="absolute left-8 text-white text-4xl">
                ←
            </button>
        
            <img id="modalImage"
                 class="max-h-[90%] max-w-[90%] object-contain transition duration-300">
        
            <button onclick="nextImage()"
                    class="absolute right-8 text-white text-4xl">
                →
            </button>
        </div>
        
        <!-- Product Info -->
        <div>
            <h1 class="text-3xl font-serif mb-4">
                {{ product.name }}
            </h1>

            <p class="text-xl text-[#5A4A40] mb-4">
                ₹{{ product.price }}
            </p>

            <p class="mb-6">
                MRP: ₹{{ product.mrp }}
            </p>

            <form method="post" action="{% url 'add_to_cart' %}">
                {% csrf_token %}
            
                <div class="mb-4">
                    <label class="block mb-2 font-medium">Select Size</label>
            
                    <select name="variant_id" class="border px-4 py-2 w-40">
                        {% for variant in product.variants.all %}
                            {% if variant.stock > 0 %}
                                <option value="{{ variant.id }}">
                                    {{ variant.size }}
                                </option>
                            {% else %}
                                <option disabled>
                                    {{ variant.size }} (Out of stock)
                                </option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            
                <button type="submit"
                        class="inline-block bg-[#6B7A46] text-white px-8 py-3 hover:bg-[#556136] transition">
                    Add to Cart
                </button>
            </form>

            <div class="mt-8">
                <p><strong>Product Code:</strong> {{ product.product_code }}</p>
                <p><strong>Category:</strong> {{ product.category }}</p>
            </div>

        </div>

    </div>
</section>

<script>
    const images = [
        {% for image in product.images.all %}
            "{{ image.optimized.1200|default:image.original_image.url }}",
        {% endfor %}
    ];

    let currentIndex = 0;
    const mainImage = document.getElementById("mainImage");
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
	
    mainImage.addEventListener("click", openModal);	
    
    function changeImage(index) {
        currentIndex = index;
    
        mainImage.classList.add("opacity-0");
    
        setTimeout(() => {
            mainImage.src = images[currentIndex];
            modalImage.src = images[currentIndex];
            mainImage.classList.remove("opacity-0");
        }, 150);
    }

    function nextImage() {
        currentIndex = (currentIndex + 1) % images.length;
        changeImage(currentIndex);
    }

    function prevImage() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        changeImage(currentIndex);
    }

    function openModal() {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
        modalImage.src = images[currentIndex];
    }

    function closeModal() {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
    }

    // 🔥 Cursor-follow Zoom (Luxury Effect)
/*
        mainImage.addEventListener("mousemove", function(e) {
        const rect = mainImage.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        mainImage.style.transformOrigin = `${x}px ${y}px`;
        mainImage.style.transform = "scale(2)";
    });

    mainImage.addEventListener("mouseleave", function() {
        mainImage.style.transform = "scale(1)";
    });
*/
    // 📱 Swipe for Mobile
    let startX = 0;

    mainImage.addEventListener("touchstart", e => {
        startX = e.touches[0].clientX;
    });

    mainImage.addEventListener("touchend", e => {
        let endX = e.changedTouches[0].clientX;

        if (startX - endX > 50) {
            nextImage();
        } else if (endX - startX > 50) {
            prevImage();
        }
    });
</script>
{% endblock %}
