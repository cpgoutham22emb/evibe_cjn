{% extends "store/base.html" %}
{% block content %}

<div class="max-w-6xl mx-auto py-12">

    <h2 class="text-3xl font-bold mb-8 capitalize">
        {{ category.name }} Collection
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

        {% for product in products %}

        <div class="border rounded-xl p-4 shadow hover:shadow-lg transition">

            <a href="{% url 'product_detail' product.slug %}">

                {% if product.images.first %}
                    <picture>
                        <source media="(max-width: 600px)"
                                srcset="{{ product.images.first.optimized.400|default:product.images.first.original_image.url }}">
                
                        <source media="(max-width: 1024px)"
                                srcset="{{ product.images.first.optimized.800|default:product.images.first.original_image.url }}">
                
                        <img src="{{ product.images.first.optimized.800|default:product.images.first.original_image.url }}"
                             loading="lazy"
                             decoding="async"
                             class="w-full h-auto object-cover rounded-lg mb-4">
                    </picture>
                {% endif %}

                <h3 class="text-lg font-semibold">
                    {{ product.name }}
                </h3>

            </a>

            <p class="mt-2 text-gray-600 font-medium">
                ₹{{ product.price }}
            </p>

            <a href="{% url 'product_detail' product.slug %}"
               class="inline-block mt-4 bg-[#6B7A46] text-white px-6 py-2 hover:bg-[#556136] transition">
               View Product
            </a>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
