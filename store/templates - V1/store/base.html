{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>EVIBE</title>

    <script src="https://cdn.tailwindcss.com"></script>
	
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    let current = 0;

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.remove("opacity-100");
            slide.classList.add("opacity-0");

            dots[i].classList.remove("bg-white/80");
            dots[i].classList.add("bg-white/40");
        });

        slides[index].classList.remove("opacity-0");
        slides[index].classList.add("opacity-100");

        dots[index].classList.remove("bg-white/40");
        dots[index].classList.add("bg-white/80");

        current = index;
    }

    dots.forEach((dot, index) => {
        dot.addEventListener("click", () => showSlide(index));
    });

    setInterval(() => {
        let next = (current + 1) % slides.length;
        showSlide(next);
    }, 4000);

});
</script>

<body>

      <nav class="flex justify-between items-center px-12 py-6 bg-white shadow-sm">
          <div class="text-2xl font-bold tracking-wider">
              EVIBE
          </div>
      
          <div class="space-x-10 text-lg font-medium">
              <a href="/" class="hover:text-gray-500 transition">Home</a>
              <a href="/products/" class="hover:text-gray-500 transition">Shop</a>
              <a href="/cart/" class="hover:text-gray-500 transition">Cart</a>
          </div>
      </nav>
    {% block content %}
    {% endblock %}

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 EVIBE. Crafted with confidence.</p>
    </footer>

</body>
</html>
